<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="astrack">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>astrack</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    window.ASTRACK_SPEECH = {
      recognition: null,
      isListening: false,
      transcript: '',
      start: function(lang) {
        var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          console.warn('SpeechRecognition API not available in this browser.');
          return false;
        }
        try {
          if (this.recognition) {
            try { this.recognition.abort(); } catch(e) {}
          }
          var rec = new SpeechRecognition();
          rec.lang = lang || 'id-ID';
          rec.continuous = true;
          rec.interimResults = true;
          this.transcript = '';
          this.isListening = true;

          rec.onresult = function(event) {
            var full = '';
            for (var i = 0; i < event.results.length; i++) {
              full += event.results[i][0].transcript;
            }
            window.ASTRACK_SPEECH.transcript = full;
            window.dispatchEvent(new CustomEvent('astrack_speech_result', { detail: full }));
          };

          rec.onerror = function(event) {
            console.warn('Speech error:', event.error);
            if (event.error !== 'no-speech') {
              window.ASTRACK_SPEECH.isListening = false;
            }
          };

          rec.onend = function() {
            window.ASTRACK_SPEECH.isListening = false;
            window.dispatchEvent(new CustomEvent('astrack_speech_end', { detail: window.ASTRACK_SPEECH.transcript }));
          };

          this.recognition = rec;
          rec.start();
          return true;
        } catch (err) {
          console.error('Error starting speech:', err);
          return false;
        }
      },
      stop: function() {
        if (this.recognition) {
          try { this.recognition.stop(); } catch(e) {}
        }
        this.isListening = false;
        return this.transcript || '';
      },
      getTranscript: function() {
        return this.transcript || '';
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
